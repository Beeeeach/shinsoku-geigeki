<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神速の迎撃戦線 | 得点管理コンソール</title>
<style>
  :root {
    --od-black: #14171a;
    --od-panel: #1c2024;
    --od-panel2: #22262a;
    --od-olive: #4a5240;
    --team-a: #d64545;
    --team-b: #3b7fc4;
    --warn: #e8b339;
    --danger: #c73838;
    --text-dim: #8a9088;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--od-black);
    color: #eceee9;
    font-family: "Segoe UI", "Hiragino Sans", sans-serif;
    min-height: 100vh;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: var(--od-panel);
    border-bottom: 2px solid #2a2f33;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }
  .status-bar .role-tag {
    font-weight: 700;
    color: var(--warn);
  }
  #logout-btn {
    background: none;
    border: 1px solid #3a3f43;
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
  }

  /* ---------- ログイン画面 ---------- */
  #login-screen {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
  }
  #login-screen h1 {
    font-size: 18px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  #login-screen input {
    width: 100%;
    max-width: 320px;
    padding: 12px 14px;
    background: var(--od-panel);
    border: 2px solid #2a2f33;
    border-radius: 4px;
    color: #eceee9;
    font-size: 16px;
  }
  #login-screen input:focus { outline: none; border-color: var(--warn); }
  #login-btn {
    width: 100%;
    max-width: 320px;
    padding: 14px;
    background: var(--od-olive);
    border: none;
    border-radius: 4px;
    color: #eceee9;
    font-size: 16px;
    font-weight: 700;
  }
  #login-error {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
  }

  /* ---------- メイン画面 ---------- */
  #main-screen { display: none; padding: 16px; max-width: 720px; margin: 0 auto; }
  #main-screen.active { display: block; }

  .panel {
    background: var(--od-panel);
    border: 1px solid #2a2f33;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  /* 元に戻すバー(画面上部固定・常時表示) */
  .undo-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--od-panel2);
    border: 1px solid #3a3f43;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .undo-bar .undo-desc {
    font-size: 13px;
    color: var(--text-dim);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .undo-bar .undo-desc.empty { color: #565b58; }
  #undo-btn {
    flex-shrink: 0;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    background: var(--warn);
    color: #2a2000;
  }
  #undo-btn:disabled {
    background: #33373a;
    color: var(--text-dim);
  }

  /* 試合ステータス */
  .match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .match-number { font-size: 14px; color: var(--text-dim); }
  .match-badge {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
  }
  .match-badge.waiting { background: #3a3520; color: var(--warn); }
  .match-badge.playing { background: #1e3a20; color: #7dc47d; }
  .match-badge.finished { background: #33373a; color: var(--text-dim); }

  .timer-big {
    text-align: center;
    font-size: 40px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    padding: 8px 0;
  }

  .match-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .match-controls button {
    flex: 1;
    min-width: 120px;
    padding: 14px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  #start-match-btn { background: #2e6b32; color: #fff; }
  #next-match-btn { background: var(--od-olive); color: #fff; }
  #reset-score-btn { background: #4a3520; color: var(--warn); }

  /* 得点表示・手動調整 */
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .team-score-box {
    background: var(--od-panel2);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .team-score-box.a { border-top: 3px solid var(--team-a); }
  .team-score-box.b { border-top: 3px solid var(--team-b); }
  .team-score-box .team-name { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .team-score-box .team-score { font-size: 36px; font-weight: 900; margin-bottom: 10px; }
  .adjust-row { display: flex; gap: 6px; justify-content: center; }
  .adjust-row button {
    width: 44px;
    height: 40px;
    border: 1px solid #3a3f43;
    background: var(--od-panel);
    color: #eceee9;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 700;
  }

  /* 的別得点入力 */
  .target-list { display: flex; flex-direction: column; gap: 10px; }
  .target-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--od-panel2);
    padding: 10px 12px;
    border-radius: 6px;
  }
  .target-row .target-info { font-size: 14px; }
  .target-row .target-info .pts { color: var(--text-dim); font-size: 12px; margin-left: 6px; }
  .target-row .target-buttons { display: flex; gap: 8px; }
  .target-row .target-buttons button {
    padding: 8px 14px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }
  .target-row .target-buttons .a-btn { background: var(--team-a); }
  .target-row .target-buttons .b-btn { background: var(--team-b); }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--od-panel2);
    border: 1px solid #3a3f43;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="status-bar">
  <span>神速の迎撃戦線 <span class="role-tag">得点管理コンソール</span></span>
  <a href="../staff-links/index.html" style="color:var(--text-dim);font-size:12px;text-decoration:underline;">スタッフリンク集に戻る</a>
</div>

<!-- メイン画面 -->
<div id="main-screen" class="active">

  <!-- 元に戻すバー: 得点操作を1手だけ取り消せる -->
  <div class="undo-bar">
    <span class="undo-desc empty" id="undo-desc">取り消せる操作はありません</span>
    <button id="undo-btn" disabled>元に戻す</button>
  </div>

  <div class="panel">
    <h2>試合コントロール</h2>
    <div class="match-header">
      <span class="match-number" id="match-number">第1試合</span>
      <span class="match-badge waiting" id="match-badge">待機中</span>
    </div>
    <div class="timer-big" id="timer-display">--:--</div>
    <div class="match-controls">
      <button id="start-match-btn">試合開始</button>
      <button id="next-match-btn">次の試合へ(得点リセット)</button>
    </div>
  </div>

  <div class="panel">
    <h2>現在の得点</h2>
    <div class="score-grid">
      <div class="team-score-box a">
        <div class="team-name" id="team-a-name">チームA</div>
        <div class="team-score" id="score-a">0</div>
        <div class="adjust-row">
          <button data-team="A" data-delta="-1">-1</button>
          <button data-team="A" data-delta="1">+1</button>
        </div>
      </div>
      <div class="team-score-box b">
        <div class="team-name" id="team-b-name">チームB</div>
        <div class="team-score" id="score-b">0</div>
        <div class="adjust-row">
          <button data-team="B" data-delta="-1">-1</button>
          <button data-team="B" data-delta="1">+1</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>的の命中を記録(チームを選んで加点)</h2>
    <div class="target-list" id="target-list">
      <!-- JSで動的生成 -->
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import {
  db, ref, onValue, set, update, runTransaction, requireStaffGate, serverTimestamp
} from "../shared/firebase-config.js";

// staff-links の合言葉ゲートを通過していなければリダイレクト
requireStaffGate();

const matchNumberEl = document.getElementById("match-number");
const matchBadgeEl = document.getElementById("match-badge");
const timerDisplay = document.getElementById("timer-display");
const startMatchBtn = document.getElementById("start-match-btn");
const nextMatchBtn = document.getElementById("next-match-btn");
const scoreAEl = document.getElementById("score-a");
const scoreBEl = document.getElementById("score-b");
const teamANameEl = document.getElementById("team-a-name");
const teamBNameEl = document.getElementById("team-b-name");
const targetListEl = document.getElementById("target-list");
const toast = document.getElementById("toast");
const undoBtn = document.getElementById("undo-btn");
const undoDescEl = document.getElementById("undo-desc");

let matchDuration = 120;
let startTime = 0;
let currentStatus = "waiting";
let currentMatchNumber = 1;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1500);
}

// ------------------------------------------------------------
// 直前操作の取り消し(Undo)機構
// 得点に影響する操作(±1調整・的の命中記録)を1手だけ記録し、
// 押し間違えた際にすぐ元に戻せるようにする。
// 「試合開始」「次の試合へ」などの試合進行操作は対象外
// (別の確認ダイアログで保護されているため)。
// ------------------------------------------------------------
let lastAction = null; // { team, delta, description }

function pushUndo(team, delta, description) {
  lastAction = { team, delta, description };
  undoBtn.disabled = false;
  undoDescEl.classList.remove("empty");
  undoDescEl.textContent = `直前の操作: ${description}`;
}

function clearUndo() {
  lastAction = null;
  undoBtn.disabled = true;
  undoDescEl.classList.add("empty");
  undoDescEl.textContent = "取り消せる操作はありません";
}

undoBtn.addEventListener("click", () => {
  if (!lastAction) return;
  const { team, delta } = lastAction;
  const scoreRef = ref(db, `match/score/${team}`);
  // 加算した分をそのまま差し引く(0未満にはしない)
  runTransaction(scoreRef, (current) => Math.max(0, (current || 0) - delta));
  showToast(`「${lastAction.description}」を取り消しました`);
  clearUndo();
});

// ------------------------------------------------------------
// config(チーム名・的・試合時間)の購読
// ------------------------------------------------------------
onValue(ref(db, "config/teamNames"), (snap) => {
  const names = snap.val();
  if (names) {
    teamANameEl.textContent = names.A || "チームA";
    teamBNameEl.textContent = names.B || "チームB";
  }
});

onValue(ref(db, "config/matchDuration"), (snap) => {
  if (snap.val()) matchDuration = snap.val();
});

onValue(ref(db, "config/targets"), (snap) => {
  const targets = snap.val() || {};
  targetListEl.innerHTML = "";
  Object.entries(targets).forEach(([key, t]) => {
    const row = document.createElement("div");
    row.className = "target-row";
    row.innerHTML = `
      <div class="target-info">${t.name}<span class="pts">${t.points}点</span></div>
      <div class="target-buttons">
        <button class="a-btn" data-key="${key}" data-team="A" data-points="${t.points}">A命中</button>
        <button class="b-btn" data-key="${key}" data-team="B" data-points="${t.points}">B命中</button>
      </div>
    `;
    targetListEl.appendChild(row);
  });
});

targetListEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-team]");
  if (!btn) return;
  const team = btn.dataset.team;
  const points = Number(btn.dataset.points);
  const targetName = btn.closest(".target-row").querySelector(".target-info").firstChild.textContent.trim();
  const scoreRef = ref(db, `match/score/${team}`);
  runTransaction(scoreRef, (current) => (current || 0) + points);
  const teamLabel = team === "A" ? teamANameEl.textContent : teamBNameEl.textContent;
  showToast(`${teamLabel} に ${points}点`);
  pushUndo(team, points, `${teamLabel} に ${points}点`);

  // 演出用イベントを発行(ボード・プレイヤー端末が購読して撃破演出を表示する)
  // clientTs は購読側で「新しいイベントかどうか」を判定するための一意な値
  set(ref(db, "events/latest"), {
    type: "targetHit",
    team: team,
    teamName: teamLabel,
    targetName: targetName,
    points: points,
    ts: serverTimestamp(),
    clientTs: Date.now()
  });
});

// ------------------------------------------------------------
// 得点の手動+1/-1調整
// ------------------------------------------------------------
document.querySelectorAll(".adjust-row button").forEach((btn) => {
  btn.addEventListener("click", () => {
    const team = btn.dataset.team;
    const delta = Number(btn.dataset.delta);
    const scoreRef = ref(db, `match/score/${team}`);
    runTransaction(scoreRef, (current) => Math.max(0, (current || 0) + delta));
    const teamLabel = team === "A" ? teamANameEl.textContent : teamBNameEl.textContent;
    const sign = delta > 0 ? "+" : "";
    pushUndo(team, delta, `${teamLabel} を ${sign}${delta}点 手動調整`);
  });
});

// ------------------------------------------------------------
// 得点の表示
// ------------------------------------------------------------
onValue(ref(db, "match/score"), (snap) => {
  const score = snap.val() || { A: 0, B: 0 };
  scoreAEl.textContent = score.A ?? 0;
  scoreBEl.textContent = score.B ?? 0;
});

// ------------------------------------------------------------
// 試合状態の表示・タイマー
// ------------------------------------------------------------
onValue(ref(db, "match/status"), (snap) => {
  currentStatus = snap.val() || "waiting";
  matchBadgeEl.className = "match-badge " + currentStatus;
  matchBadgeEl.textContent =
    currentStatus === "waiting" ? "待機中" :
    currentStatus === "playing" ? "試合中" : "終了";
  startMatchBtn.disabled = currentStatus === "playing";
});

onValue(ref(db, "match/startTime"), (snap) => { startTime = snap.val() || 0; });
onValue(ref(db, "match/matchNumber"), (snap) => {
  currentMatchNumber = snap.val() || 1;
  matchNumberEl.textContent = `第${currentMatchNumber}試合`;
});

function tickTimer() {
  if (currentStatus !== "playing" || !startTime) {
    if (currentStatus === "waiting") timerDisplay.textContent = "--:--";
    return;
  }
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const remaining = Math.max(0, matchDuration - elapsed);
  const min = String(Math.floor(remaining / 60)).padStart(2, "0");
  const sec = String(remaining % 60).padStart(2, "0");
  timerDisplay.textContent = `${min}:${sec}`;

  if (remaining <= 0 && currentStatus === "playing") {
    // 0秒到達で自動終了(実際にDBに書き込むのは1回だけにしたいので簡易フラグ管理)
    set(ref(db, "match/status"), "finished");
  }
}
setInterval(tickTimer, 250);

// ------------------------------------------------------------
// 試合開始 / 次の試合へ
// ------------------------------------------------------------
startMatchBtn.addEventListener("click", () => {
  update(ref(db, "match"), {
    status: "playing",
    startTime: Date.now()
  });
});

nextMatchBtn.addEventListener("click", () => {
  if (!confirm("得点をリセットして次の試合を準備します。よろしいですか?")) return;
  update(ref(db, "match"), {
    status: "waiting",
    startTime: 0,
    score: { A: 0, B: 0 },
    matchNumber: currentMatchNumber + 1
  });
  // 試合を切り替えたら、直前の得点操作を取り消す意味がなくなるためクリア
  clearUndo();
});
</script>
</body>
</html>
