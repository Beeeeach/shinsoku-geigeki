<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神速の迎撃戦線 | スコアボード</title>
<style>
  :root {
    --od-black: #0d0f11;
    --od-panel: #16191c;
    --team-a: #e04a4a;
    --team-b: #4a90d6;
    --warn: #f0c04a;
    --text-dim: #6b716e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--od-black);
    color: #f2f4f0;
    font-family: "Segoe UI", "Hiragino Sans", sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  /* ---------- ヘッダー ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3vh 4vw 1vh;
    flex-shrink: 0;
  }
  header .title {
    font-size: 2.4vw;
    font-weight: 900;
    letter-spacing: 0.15em;
    color: var(--text-dim);
  }
  header .match-number {
    font-size: 2.4vw;
    font-weight: 700;
    color: var(--text-dim);
  }

  /* ---------- ステータス・タイマー ---------- */
  .status-timer-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1vh 0 2vh;
    flex-shrink: 0;
  }
  .match-badge {
    font-size: 2.2vw;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 0.5vh 2vw;
    border-radius: 6px;
    margin-bottom: 1vh;
  }
  .match-badge.waiting { background: #3a3520; color: var(--warn); }
  .match-badge.playing { background: #1e3a20; color: #7dc47d; }
  .match-badge.finished { background: #2a2d30; color: var(--text-dim); }

  .timer {
    font-size: 12vw;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .timer.urgent { color: var(--team-a); animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ---------- 得点表示 ---------- */
  .score-row {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4vw;
    padding: 0 4vw;
  }
  .team-box {
    flex: 1;
    max-width: 40vw;
    text-align: center;
    padding: 3vh 2vw;
    border-radius: 20px;
    background: var(--od-panel);
  }
  .team-box.a { border-bottom: 8px solid var(--team-a); }
  .team-box.b { border-bottom: 8px solid var(--team-b); }
  .team-box .team-name {
    font-size: 2.6vw;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 1vh;
  }
  .team-box.a .team-name { color: var(--team-a); }
  .team-box.b .team-name { color: var(--team-b); }
  .team-box .team-score {
    font-size: 14vw;
    font-weight: 900;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .vs-divider {
    font-size: 4vw;
    font-weight: 900;
    color: var(--text-dim);
  }

  /* ---------- 選手名一覧 ---------- */
  .roster {
    margin-top: 2.2vh;
    display: flex;
    flex-direction: column;
    gap: 0.6vh;
  }
  .roster .roster-item {
    font-size: 1.35vw;
    letter-spacing: 0.05em;
    color: #d7dbd6;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
    padding: 0.6vh 0.5vw;
  }
  .roster .roster-item.empty {
    color: var(--text-dim);
    opacity: 0.6;
  }

  /* フッターは待ち人数表示の廃止に伴い、下部の余白として残す */
  footer {
    flex-shrink: 0;
    padding: 4vh 0;
  }

  /* ---------- 撃破・被弾演出(黒板投影用: 派手に大画面表示) ---------- */
  #event-popup {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    background: rgba(0,0,0,0);
    transition: opacity 0.2s, background 0.2s;
  }
  #event-popup.show { opacity: 1; }
  #event-popup .popup-card {
    text-align: center;
    padding: 4vh 6vw;
    border-radius: 26px;
    transform: scale(0.6) rotate(-3deg);
    transition: transform 0.3s cubic-bezier(.2,1.4,.5,1);
  }
  #event-popup.show .popup-card {
    transform: scale(1) rotate(0deg);
  }
  #event-popup .popup-label {
    font-size: 1.8vw;
    letter-spacing: 0.3em;
    margin-bottom: 1.4vh;
    opacity: 0.9;
  }
  #event-popup .popup-main {
    font-size: 4.2vw;
    font-weight: 900;
    line-height: 1.3;
    letter-spacing: 0.03em;
    text-shadow: 0 0 30px rgba(0,0,0,0.5);
  }

  #event-popup.hit-a { background: rgba(224, 74, 74, 0.3); }
  #event-popup.hit-a .popup-card {
    background: linear-gradient(160deg, var(--team-a), #6e1c1c);
    box-shadow: 0 0 100px rgba(224,74,74,0.8);
    animation: board-shake 0.4s;
  }
  #event-popup.hit-b { background: rgba(74, 144, 214, 0.3); }
  #event-popup.hit-b .popup-card {
    background: linear-gradient(160deg, var(--team-b), #1c3f61);
    box-shadow: 0 0 100px rgba(74,144,214,0.8);
    animation: board-shake 0.4s;
  }
  #event-popup.target-a { background: rgba(224, 74, 74, 0.2); }
  #event-popup.target-a .popup-card {
    background: linear-gradient(160deg, #e04a4a, #8a2a2a);
    box-shadow: 0 0 100px rgba(224,74,74,0.7);
  }
  #event-popup.target-b { background: rgba(74, 144, 214, 0.2); }
  #event-popup.target-b .popup-card {
    background: linear-gradient(160deg, #4a90d6, #23517d);
    box-shadow: 0 0 100px rgba(74,144,214,0.7);
  }

  @keyframes board-shake {
    0%, 100% { transform: scale(1) translateX(0) rotate(0deg); }
    20% { transform: scale(1.03) translateX(-14px) rotate(-2deg); }
    40% { transform: scale(1.03) translateX(14px) rotate(2deg); }
    60% { transform: scale(1.03) translateX(-10px) rotate(-1.2deg); }
    80% { transform: scale(1.03) translateX(10px) rotate(1.2deg); }
  }

  /* 得点更新時のフラッシュ演出 */
  .team-box.flash {
    animation: flash-anim 0.5s;
  }
  @keyframes flash-anim {
    0% { box-shadow: 0 0 0 0 rgba(240,192,74,0); }
    30% { box-shadow: 0 0 60px 10px rgba(240,192,74,0.6); }
    100% { box-shadow: 0 0 0 0 rgba(240,192,74,0); }
  }
</style>
</head>
<body>

<header>
  <span class="title">神速の迎撃戦線 SCOREBOARD</span>
  <span class="match-number" id="match-number">第1試合</span>
</header>

<div class="status-timer-row">
  <div class="match-badge waiting" id="match-badge">試合開始待ち</div>
  <div class="timer" id="timer-display">--:--</div>
</div>

<div class="score-row">
  <div class="team-box a" id="team-box-a">
    <div class="team-name" id="team-a-name">チームA</div>
    <div class="team-score" id="score-a">0</div>
    <div class="roster" id="roster-a"></div>
  </div>
  <div class="vs-divider">VS</div>
  <div class="team-box b" id="team-box-b">
    <div class="team-name" id="team-b-name">チームB</div>
    <div class="team-score" id="score-b">0</div>
    <div class="roster" id="roster-b"></div>
  </div>
</div>

<footer></footer>

<!-- 撃破・被弾演出ポップアップ(黒板投影用) -->
<div id="event-popup">
  <div class="popup-card">
    <div class="popup-label" id="popup-label">BREAKING</div>
    <div class="popup-main" id="popup-main"></div>
  </div>
</div>

<script type="module">
import { db, ref, onValue } from "../shared/firebase-config.js";

const matchNumberEl = document.getElementById("match-number");
const matchBadgeEl = document.getElementById("match-badge");
const timerDisplay = document.getElementById("timer-display");
const scoreAEl = document.getElementById("score-a");
const scoreBEl = document.getElementById("score-b");
const teamANameEl = document.getElementById("team-a-name");
const teamBNameEl = document.getElementById("team-b-name");
const teamBoxA = document.getElementById("team-box-a");
const teamBoxB = document.getElementById("team-box-b");
const rosterA = document.getElementById("roster-a");
const rosterB = document.getElementById("roster-b");
const eventPopup = document.getElementById("event-popup");
const popupLabel = document.getElementById("popup-label");
const popupMain = document.getElementById("popup-main");

let matchDuration = 120;
let startTime = 0;
let currentStatus = "waiting";
let prevScoreA = 0;
let prevScoreB = 0;
let lastSeenEventTs = 0;
let eventsInitialized = false;
let popupHideTimer = null;

// 端末ID一覧(players/teamX-N/name を購読して一覧表示する)
const UNIT_IDS_A = ["teamA-1", "teamA-2", "teamA-3", "teamA-4"];
const UNIT_IDS_B = ["teamB-1", "teamB-2", "teamB-3", "teamB-4"];

// ------------------------------------------------------------
// config の購読
// ------------------------------------------------------------
onValue(ref(db, "config/teamNames"), (snap) => {
  const names = snap.val();
  if (names) {
    teamANameEl.textContent = names.A || "チームA";
    teamBNameEl.textContent = names.B || "チームB";
  }
});

onValue(ref(db, "config/matchDuration"), (snap) => {
  if (snap.val()) matchDuration = snap.val();
});

// ------------------------------------------------------------
// 試合状態
// ------------------------------------------------------------
onValue(ref(db, "match/status"), (snap) => {
  currentStatus = snap.val() || "waiting";
  matchBadgeEl.className = "match-badge " + currentStatus;
  matchBadgeEl.textContent =
    currentStatus === "waiting" ? "試合開始待ち" :
    currentStatus === "playing" ? "戦闘中" : "試合終了";
});

onValue(ref(db, "match/startTime"), (snap) => { startTime = snap.val() || 0; });

onValue(ref(db, "match/matchNumber"), (snap) => {
  matchNumberEl.textContent = `第${snap.val() || 1}試合`;
});

function tickTimer() {
  if (currentStatus !== "playing" || !startTime) {
    timerDisplay.classList.remove("urgent");
    if (currentStatus === "waiting") timerDisplay.textContent = "--:--";
    return;
  }
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const remaining = Math.max(0, matchDuration - elapsed);
  const min = String(Math.floor(remaining / 60)).padStart(2, "0");
  const sec = String(remaining % 60).padStart(2, "0");
  timerDisplay.textContent = `${min}:${sec}`;
  timerDisplay.classList.toggle("urgent", remaining <= 10 && remaining > 0);
}
setInterval(tickTimer, 250);

// ------------------------------------------------------------
// 得点(変化時にフラッシュ演出)
// ------------------------------------------------------------
onValue(ref(db, "match/score"), (snap) => {
  const score = snap.val() || { A: 0, B: 0 };
  const newA = score.A ?? 0;
  const newB = score.B ?? 0;

  if (newA !== prevScoreA) {
    scoreAEl.textContent = newA;
    teamBoxA.classList.remove("flash");
    void teamBoxA.offsetWidth; // reflow でアニメーションを再トリガー
    teamBoxA.classList.add("flash");
    prevScoreA = newA;
  }
  if (newB !== prevScoreB) {
    scoreBEl.textContent = newB;
    teamBoxB.classList.remove("flash");
    void teamBoxB.offsetWidth;
    teamBoxB.classList.add("flash");
    prevScoreB = newB;
  }
});

// ------------------------------------------------------------
// 選手名一覧の購読・表示
// 各端末(players/teamX-N/name)を個別に購読し、一覧を再描画する
// ------------------------------------------------------------
function setupRoster(unitIds, rosterEl) {
  const names = {}; // unitId -> name
  unitIds.forEach((unitId) => {
    onValue(ref(db, `players/${unitId}/name`), (snap) => {
      names[unitId] = snap.val() || "";
      renderRoster();
    });
  });
  function renderRoster() {
    rosterEl.innerHTML = "";
    unitIds.forEach((unitId) => {
      const name = names[unitId];
      const item = document.createElement("div");
      item.className = "roster-item" + (name ? "" : " empty");
      item.textContent = name ? name : "(待機中)";
      rosterEl.appendChild(item);
    });
  }
}
setupRoster(UNIT_IDS_A, rosterA);
setupRoster(UNIT_IDS_B, rosterB);

// ------------------------------------------------------------
// 撃破・被弾演出ポップアップの表示(黒板投影・派手めに)
// ------------------------------------------------------------
function showPopup(className, label, mainText, duration = 2600) {
  clearTimeout(popupHideTimer);
  eventPopup.className = "";
  void eventPopup.offsetWidth; // reflow
  eventPopup.classList.add(className, "show");
  popupLabel.textContent = label;
  popupMain.textContent = mainText;
  popupHideTimer = setTimeout(() => {
    eventPopup.classList.remove("show");
  }, duration);
}

// ------------------------------------------------------------
// events/latest の購読: プレイヤー撃破・的破壊のイベントをボードにも表示
// ------------------------------------------------------------
onValue(ref(db, "events/latest"), (snap) => {
  const ev = snap.val();
  if (!ev || !ev.clientTs) return;

  // 初回購読時は、ページを開く前からある古いイベントを演出表示しない
  if (!eventsInitialized) {
    eventsInitialized = true;
    lastSeenEventTs = ev.clientTs;
    return;
  }

  if (ev.clientTs <= lastSeenEventTs) return;
  lastSeenEventTs = ev.clientTs;

  if (ev.type === "playerHit") {
    const victimTeamLabel = ev.victimTeam === "A" ? teamANameEl.textContent : teamBNameEl.textContent;
    const cls = ev.victimTeam === "A" ? "hit-a" : "hit-b";
    showPopup(cls, "TAKEDOWN", `${victimTeamLabel}の${ev.victimName}が撃たれた!`);
  } else if (ev.type === "targetHit") {
    const cls = ev.team === "A" ? "target-a" : "target-b";
    showPopup(cls, "TARGET DESTROYED", `${ev.teamName}が${ev.targetName}を撃破! (+${ev.points}点)`);
  }
});
</script>
</body>
</html>
